# Configuration for KL-Regularized Autoencoder - Kaggle 2x T4 GPU Optimized
# Maximizes utilization of 2x T4 GPUs (32GB total VRAM)

experiment:
  name: "exp1_kl_no_mixed_kaggle"
  description: "KL-regularized first-stage autoencoder - Kaggle 2x T4 optimized"
  type: "first_stage_kl"
  random_seed: 42

# Model architecture (same as local)
model:
  type: "kl_autoencoder"
  in_channels: 3
  latent_channels: 4
  base_channels: 32
  channel_multipliers: [1, 2, 4, 4]
  num_res_blocks: 2
  kl_weight: 1.0e-6

# Data configuration - OPTIMIZED FOR 2x GPU
data:
  dataset_root: "/kaggle/input/no-mixed-thermal"  # Updated by notebook
  load_mode: "rgb"
  
  # Splitting
  train_ratio: 0.8
  val_ratio: 0.2
  test_ratio: 0.0
  
  # Data loading - OPTIMIZED
  batch_size: 16  # 8 per GPU (was 4 on single GPU)
  num_workers: 8  # More workers for faster data loading
  pin_memory: true
  shuffle: true
  seed: 42

# Training configuration
training:
  max_epochs: 100
  learning_rate: 1.0e-3
  
  # Optimizer
  optimizer: "adam"
  betas: [0.9, 0.999]
  weight_decay: 0.0
  
  # Learning rate schedule
  lr_scheduler:
    enabled: false
    type: "reduce_on_plateau"
    patience: 5
    factor: 0.5
  
  # Early stopping
  early_stopping:
    enabled: true
    patience: 10  # Increased patience for longer runs
    min_delta: 1.0e-6
    monitor: "val_loss"
  
  # Checkpointing
  save_frequency: 10
  save_best_only: false

# Hardware - MULTI-GPU ENABLED
hardware:
  device: "auto"
  mixed_precision: true  # ENABLED for 2x speedup on T4

# Paths
paths:
  checkpoint_dir: "checkpoints/experiment1/kl_no_mixed"
  log_dir: "logs/experiment1/kl_no_mixed"
  tensorboard_dir: "runs/experiment1/kl_no_mixed"
  output_dir: "outputs/experiment1/kl_no_mixed"

# Logging
logging:
  level: "INFO"
  log_to_file: true
  log_to_console: true
  
  tensorboard:
    enabled: false
    log_images: false
    log_frequency: 50
  
  metrics:
    - "loss"
    - "reconstruction_loss"
    - "kl_loss"
    - "mse"
    - "mae"
    - "psnr"

# Evaluation
evaluation:
  compute_ssim: true
  compute_lpips: false
  
  boundary_metrics:
    enabled: true
    threshold_percentile: 75.0
    gradient_method: "sobel"
  
  num_vis_samples: 16
  save_reconstructions: true
  save_error_maps: true
  save_boundary_masks: true

# Reproducibility
reproducibility:
  deterministic: true
  seed: 42
  benchmark: false
